name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

env:
  NODE_VERSION: '20'
  PYTHON_VERSION: '3.11'

jobs:
  # El borrador se crea aquí y una sola vez (#85).
  #
  # Los tres sistemas de la matriz de abajo corren en paralelo y los tres lanzan
  # `electron-builder --publish always`, que busca la release por tag y la crea
  # si no la encuentra. Cuando dos llegan a la vez, las dos ven que no existe y
  # las dos la crean: salen dos borradores con el mismo tag y los artefactos
  # repartidos entre ellos. Pasó en la v1.23.1 y en la v1.24.0, y publicar el
  # equivocado deja a macOS sin su blockmap —adiós descarga diferencial— o a
  # Windows sin instalador.
  #
  # Creándolo antes, los tres se lo encuentran hecho y sólo suben sus ficheros.
  preparar-release:
    name: Preparar la release
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Averiguar el tag
        id: tag
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            TAG="${{ github.ref_name }}"
          else
            # Lanzado a mano: el tag sale de la versión que declare el paquete.
            TAG="v$(node -p "require('./package.json').version")"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Release: $TAG"

      - name: Crear el borrador si no existe
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Ya existe una release para $TAG; los artefactos irán a ésa."
          else
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --draft --title "$TAG" --notes ""
            echo "Borrador creado para $TAG."
          fi

  build-and-publish:
    name: Build & Publish (${{ matrix.os }})
    needs: preparar-release
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Setup Python (for WNTR)
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy>=1.20 scipy>=1.7 pandas>=1.3 networkx>=2.6 matplotlib>=3.4 wntr>=0.5.0

      - name: Install Node dependencies
        run: npm ci --legacy-peer-deps

      - name: Generate Prisma client
        run: npm run db:generate

      - name: Build application
        run: npm run build:vite && npm run build:electron-ts

      - name: Build and publish (macOS)
        if: matrix.os == 'macos-latest'
        run: npx electron-builder --mac --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: npx electron-builder --linux --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish (Windows)
        if: matrix.os == 'windows-latest'
        run: npx electron-builder --win --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
